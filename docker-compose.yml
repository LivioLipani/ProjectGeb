services:
  # Message Broker: Redpanda
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.4
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --node-id 0
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      # Address the broker advertises to clients that connect to the Kafka API.
      # Use the internal addresses to connect to the Redpanda brokers'
      # from inside the same Docker network.
      # Use the external addresses to connect to the Redpanda brokers'
      # from outside the Docker network.
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092" # Accesso da localhost (host)
      - "9092:9092"   # Accesso interno alla rete Docker
      - "18081:8081"  # Schema Registry

  # Ingestion Gateway
  ingestion-gateway:
    build: ./ingestion-gateway
    ports:
      - "8000:8000"
    environment:
      - KAFKA_BROKER=redpanda:9092
    depends_on:
      - redpanda

networks:
  default:
    name: seismic-network